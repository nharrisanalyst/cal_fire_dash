services:
  db:
    image: postgres:15
    hostname: postgres
    restart: always
    shm_size: 128mb
    env_file:
      - .db.env
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    restart: always
    env_file:
      - .db.env
    ports:
      - "8888:80"
  flask-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./api:/api 
    env_file:
        - .db.env
    depends_on:
      - db
      - pipeline
  api-tests:
    working_dir: /api
    environment:
      PYTHONPATH: /api
    volumes:
      - ./api:/api 
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5175"
    env_file:
        - .db.env
    depends_on:
      - db
      - pipeline
  pipeline:
    build: 
      context: ./data
      dockerfile: Dockerfile
    env_file:
        - .db.env
      
    

  

